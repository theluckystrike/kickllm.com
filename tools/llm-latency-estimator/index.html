<script>
const modelLatencies = {
  'gpt-4o': { baseLatency: 500, provider: 'OpenAI', tokensPerMs: 0.08 },
  'gpt-4-turbo': { baseLatency: 600, provider: 'OpenAI', tokensPerMs: 0.06 },
  'gpt-35': { baseLatency: 300, provider: 'OpenAI', tokensPerMs: 0.12 },
  'claude-opus': { baseLatency: 800, provider: 'Anthropic', tokensPerMs: 0.05 },
  'claude-sonnet': { baseLatency: 500, provider: 'Anthropic', tokensPerMs: 0.08 },
  'claude-haiku': { baseLatency: 350, provider: 'Anthropic', tokensPerMs: 0.15 },
  'gemini-pro': { baseLatency: 400, provider: 'Google', tokensPerMs: 0.10 },
  'gemini-ultra': { baseLatency: 700, provider: 'Google', tokensPerMs: 0.07 },
  'mistral-large': { baseLatency: 450, provider: 'Mistral', tokensPerMs: 0.09 },
  'mistral-small': { baseLatency: 250, provider: 'Mistral', tokensPerMs: 0.15 }
};

function estimateLatency() {
  const model = document.getElementById('model').value;
  const inputTokens = parseInt(document.getElementById('inputTokens').value) || 500;
  const outputTokens = parseInt(document.getElementById('outputTokens').value) || 200;
  const streaming = document.getElementById('streaming').checked;
  const cached = document.getElementById('cached').checked;
  const vectorSearch = document.getElementById('vectorSearch').checked;
  const networkLatency = parseInt(document.getElementById('networkLatency').value) || 50;
  const concurrency = parseInt(document.getElementById('concurrency').value) || 1;

  const modelData = modelLatencies[model];
  const totalTokens = inputTokens + outputTokens;

  // Base latency
  let baseLatency = modelData.baseLatency;

  // Token processing time
  const tokenProcessingTime = totalTokens / modelData.tokensPerMs;

  // Network latency (request + response)
  let totalNetworkLatency = networkLatency * 2;

  // Cache benefit
  if (cached) {
    baseLatency *= 0.3;
    tokenProcessingTime *= 0.2;
  }

  // Vector search overhead
  let vectorSearchTime = 0;
  if (vectorSearch) {
    vectorSearchTime = 100 + Math.random() * 150;
  }

  // Concurrency penalty
  let concurrencyPenalty = 0;
  if (concurrency > 1) {
    concurrencyPenalty = (concurrency - 1) * 50;
  }

  // Streaming vs non-streaming
  let totalLatency = baseLatency + tokenProcessingTime + totalNetworkLatency + vectorSearchTime + concurrencyPenalty;

  if (streaming) {
    totalLatency *= 0.5; // Streaming shows first token much faster
  }

  // Build results
  const configs = [
    { name: 'Time to First Token (Streaming)', value: streaming ? totalLatency * 0.3 : totalLatency },
    { name: 'Total Latency (Non-Streaming)', value: totalLatency },
    { name: 'Token Processing Time', value: tokenProcessingTime },
    { name: 'Base Overhead', value: baseLatency }
  ];

  let resultsHtml = `
    <div class="latency-card">
      <div class="provider-name">${modelData.provider}</div>
      <div class="latency-display">${totalLatency.toFixed(0)}</div>
      <div class="latency-unit">ms total latency</div>
      <div class="latency-breakdown">
        <div class="breakdown-line">
          <span class="breakdown-label">Model:</span>
          <span class="breakdown-value">${model.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')}</span>
        </div>
        <div class="breakdown-line">
          <span class="breakdown-label">Input Tokens:</span>
          <span class="breakdown-value">${inputTokens}</span>
        </div>
        <div class="breakdown-line">
          <span class="breakdown-label">Output Tokens:</span>
          <span class="breakdown-value">${outputTokens}</span>
        </div>
        <div class="breakdown-line">
          <span class="breakdown-label">Token Time:</span>
          <span class="breakdown-value">${tokenProcessingTime.toFixed(0)}ms</span>
        </div>
        <div class="breakdown-line">
          <span class="breakdown-label">Network RTT:</span>
          <span class="breakdown-value">${totalNetworkLatency}ms</span>
        </div>
        ${vectorSearch ? `
        <div class="breakdown-line">
          <span class="breakdown-label">Vector Search:</span>
          <span class="breakdown-value">${vectorSearchTime.toFixed(0)}ms</span>
        </div>
        ` : ''}
        ${streaming ? `
        <div class="breakdown-line">
          <span class="breakdown-label">First Token:</span>
          <span class="breakdown-value">${(totalLatency * 0.3).toFixed(0)}ms</span>
        </div>
        ` : ''}
      </div>
    </div>
  `;

  document.getElementById('latencyResults').innerHTML = resultsHtml;

  // Timeline visualization
  let timelineHtml = `
    <div class="timeline-title">Latency Breakdown</div>
    <div style="margin-bottom: 20px;">
      <div style="display: flex; margin-bottom: 10px; gap: 15px; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 150px;">
          <div style="color: #888; font-size: 0.85rem; margin-bottom: 6px;">Total: ${totalLatency.toFixed(0)}ms</div>
          <div class="timeline-bar">
            <div class="timeline-bar-inner" style="width: 100%;">${totalLatency.toFixed(0)}ms</div>
          </div>
        </div>
      </div>
      ${streaming ? `
      <div style="padding: 12px; background: #0f0f0f; border-radius: 6px; font-size: 0.9rem; color: #888;">
        ⚡ <strong style="color: #3b82f6;">Streaming Mode:</strong> First token arrives in ~${(totalLatency * 0.3).toFixed(0)}ms, full response in ~${totalLatency.toFixed(0)}ms
      </div>
      ` : `
      <div style="padding: 12px; background: #0f0f0f; border-radius: 6px; font-size: 0.9rem; color: #888;">
        📤 <strong style="color: #3b82f6;">Non-Streaming:</strong> Wait for complete response (~${totalLatency.toFixed(0)}ms)
      </div>
      `}
    </div>
  `;

  document.getElementById('timelineDiv').innerHTML = timelineHtml;

  // Insights
  let insightsHtml = '<h3>Optimization Insights</h3>';

  if (totalLatency > 2000) {
    insightsHtml += `
      <div class="insight-item">
        <div class="insight-text">⚠️ <strong>High Latency:</strong> Consider streaming mode to improve perceived performance (reduces first-token time by 70%).</div>
      </div>
    `;
  }

  if (vectorSearch) {
    insightsHtml += `
      <div class="insight-item">
        <div class="insight-text">🔍 <strong>Vector Search Overhead:</strong> Caching embeddings could reduce latency by ~40%. Implement prompt caching.</div>
      </div>
    `;
  }

  if (concurrency > 1) {
    insightsHtml += `
      <div class="insight-item">
        <div class="insight-text">⚙️ <strong>Concurrency:</strong> Multiple requests detected. Use batching to reduce per-request overhead by 20-30%.</div>
      </div>
    `;
  }

  if (cached) {
    insightsHtml += `
      <div class="insight-item">
        <div class="insight-text">✓ <strong>Prompt Caching Enabled:</strong> Baseline latency reduced by 70%. Great for repetitive queries!</div>
      </div>
    `;
  } else if (inputTokens > 2000) {
    insightsHtml += `
      <div class="insight-item">
        <div class="insight-text">💰 <strong>Prompt Caching Opportunity:</strong> With ${inputTokens} input tokens, caching could save 90% latency on repeated requests.</div>
      </div>
    `;
  }

  document.getElementById('insightsDiv').innerHTML = insightsHtml;

  // Comparison table
  let tableHtml = `
    <h3>Provider Comparison (Same Configuration)</h3>
    <table>
      <tr>
        <th>Provider</th>
        <th>Model</th>
        <th>Est. Latency</th>
        <th>First Token</th>
        <th>Best For</th>
      </tr>
  `;

  const comparisonModels = [
    { key: 'gpt-4o', best: 'Highest quality' },
    { key: 'claude-sonnet', best: 'Best balance' },
    { key: 'mistral-small', best: 'Speed' }
  ];

  comparisonModels.forEach(cm => {
    const md = modelLatencies[cm.key];
    const tokenTime = totalTokens / md.tokensPerMs;
    const est = md.baseLatency + tokenTime + 100;
    const first = streaming ? est * 0.3 : est;

    tableHtml += `
      <tr>
        <td>${md.provider}</td>
        <td>${cm.key}</td>
        <td>${est.toFixed(0)}ms</td>
        <td>${first.toFixed(0)}ms</td>
        <td>${cm.best}</td>
      </tr>
    `;
  });

  tableHtml += '</table>';
  document.getElementById('comparisonDiv').innerHTML = tableHtml;

  document.getElementById('resultsContainer').style.display = 'block';
}

// Calculate on load
window.addEventListener('load', () => {
  estimateLatency();
});
</script>
