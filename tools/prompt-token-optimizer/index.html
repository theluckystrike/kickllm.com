<div class="container">

    <h1>Prompt Token Optimizer</h1>

    <div class="form-group">
      <label for="promptInput">Paste Your Prompt:</label>
      <textarea id="promptInput" placeholder="Enter your full system prompt, few-shot examples, or any text to analyze..."></textarea>
      <div class="char-count"><span id="charCount">0</span> characters</div>
    </div>

    <div class="form-group">
      <label>Optimization Focus:</label>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <label style="display: flex; align-items: center; font-weight: 400; color: #e8e8e8;">
          <input type="checkbox" id="removeRedundant" checked style="margin-right: 8px; cursor: pointer;">
          Remove Redundancy
        </label>

          <input type="checkbox" id="minifyWhitespace" checked style="margin-right: 8px; cursor: pointer;">
          Minify Whitespace
        </label>
        <label style="display: flex; align-items: center; font-weight: 400; color: #e8e8e8;">
          <input type="checkbox" id="abbreviate" checked style="margin-right: 8px; cursor: pointer;">
          Use Abbreviations
        </label>
      </div>
    </div>

      <button onclick="analyzeAndOptimize()">Analyze & Optimize</button>
      <button class="secondary" onclick="resetForm()">Clear</button>

    <div class="stats-grid" id="statsGrid"></div>

<script>
document.getElementById('promptInput').addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length;
});

function estimateTokens(text) {
  return Math.ceil(text.split(/\s+/).length * 1.3);
}

function analyzeAndOptimize() {
  const originalText = document.getElementById('promptInput').value;
  if (!originalText.trim()) {
    alert('Please enter some text to analyze');
    return;
  }

  const removeRedundant = document.getElementById('removeRedundant').checked;
  const minifyWhitespace = document.getElementById('minifyWhitespace').checked;
  const abbreviate = document.getElementById('abbreviate').checked;

  const originalTokens = estimateTokens(originalText);
  let optimizedText = originalText;

  // Remove redundant phrases
  if (removeRedundant) {
    optimizedText = optimizedText.replace(/\b(please|kindly|thank you|regards)\b/gi, '');
    optimizedText = optimizedText.replace(/\s+/g, ' ');
  }

  // Minify whitespace
  if (minifyWhitespace) {
    optimizedText = optimizedText.replace(/\n\n+/g, '\n');
    optimizedText = optimizedText.replace(/\t/g, '');
  }

  // Apply abbreviations
  if (abbreviate) {
    const abbrevMap = {
      'should': 'shld',
      'because': 'bc',
      'you are': "you're",
      'it is': "it's",
      'that is': "that's",
      'important': 'imp',
      'information': 'info',
      'response': 'resp',
      'example': 'ex',
      'following': 'foll',
      'according': 'acc',
      'previous': 'prev'
    };

    for (const [word, abbr] of Object.entries(abbrevMap)) {
      const regex = new RegExp('\\b' + word + '\\b', 'gi');
      optimizedText = optimizedText.replace(regex, abbr);
    }
  }

  optimizedText = optimizedText.trim();
  const optimizedTokens = estimateTokens(optimizedText);
  const tokensSaved = originalTokens - optimizedTokens;
  const percentSaved = ((tokensSaved / originalTokens) * 100).toFixed(1);

  // Generate stats
  let statsHtml = `
    <div class="stat-card">
      <div class="stat-label">Original Tokens</div>
      <div class="stat-value">${originalTokens}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Optimized Tokens</div>
      <div class="stat-value">${optimizedTokens}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tokens Saved</div>
      <div class="stat-value">${tokensSaved}</div>
      <div class="stat-change">${percentSaved}% reduction</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Original Chars</div>
      <div class="stat-value">${originalText.length}</div>
    </div>
  `;
  document.getElementById('statsGrid').innerHTML = statsHtml;

  // Generate suggestions
  let suggestions = [
    { title: 'Remove Filler Words', desc: 'Eliminate "please", "kindly", "thank you" - they add tokens without semantic value.' },
    { title: 'Consolidate Whitespace', desc: 'Replace multiple line breaks with single lines. Extra spacing wastes tokens.' },
    { title: 'Use Abbreviations', desc: 'Replace common words with shorter versions (important → imp, information → info).' },
    { title: 'Use Bullet Points', desc: 'Replace verbose prose with structured lists - more tokens-efficient for structured data.' },
    { title: 'Remove Repetition', desc: 'Avoid restating the same instruction. Reference previous context instead.' }
  ];

  let suggestionsHtml = '<h3>💡 Optimization Tips</h3>';
  suggestions.forEach(s => {
    suggestionsHtml += `
      <div class="suggestion-item">
        <div class="suggestion-title">${s.title}</div>
        <div class="suggestion-desc">${s.desc}</div>
      </div>
    `;
  });
  document.getElementById('suggestionsDiv').innerHTML = suggestionsHtml;

  // Show compressed version
  let compressedHtml = `
    <h3>Optimized Prompt</h3>
    <div class="compressed-text">${optimizedText.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
    <button class="copy-button" onclick="copyToClipboard()">📋 Copy Optimized Prompt</button>
  `;
  document.getElementById('compressedDiv').innerHTML = compressedHtml;
  window.optimizedPrompt = optimizedText;

  // Cost comparison
  const models = [
    { name: 'GPT-3.5 Turbo', origCost: (originalTokens / 1000000) * 0.0015, optCost: (optimizedTokens / 1000000) * 0.0015 },
    { name: 'GPT-4o', origCost: (originalTokens / 1000000) * 0.0025, optCost: (optimizedTokens / 1000000) * 0.0025 },
    { name: 'Claude 3.5 Haiku', origCost: (originalTokens / 1000000) * 0.00080, optCost: (optimizedTokens / 1000000) * 0.00080 },
    { name: 'Gemini 2.0 Flash', origCost: (originalTokens / 1000000) * 0.00375, optCost: (optimizedTokens / 1000000) * 0.00375 }
  ];

  let costHtml = '<h3>💰 Cost Savings by Model</h3>';
  models.forEach(m => {
    const savings = m.origCost - m.optCost;
    const savingsPercent = ((savings / m.origCost) * 100).toFixed(1);
    costHtml += `
      <div class="cost-row">
        <span class="cost-label">${m.name}</span>
        <span style="color: #888;">$${m.origCost.toFixed(6)} → $${m.optCost.toFixed(6)}</span>
        <span class="cost-value">-$${savings.toFixed(6)} (${savingsPercent}%)</span>
      </div>
    `;
  });
  costHtml += `
    <div class="cost-row" style="background: rgba(59, 130, 246, 0.1); border-top: 2px solid #3b82f6; margin-top: 10px; padding-top: 15px;">
      <span style="color: #3b82f6; font-weight: 600;">Total Monthly Savings (100 calls/day)</span>
      <span class="cost-value">~$${(((originalTokens - optimizedTokens) / 1000000) * 0.003 * 3000).toFixed(2)}</span>
    </div>
  `;
  document.getElementById('costDiv').innerHTML = costHtml;

  document.getElementById('resultsContainer').style.display = 'block';
}

function copyToClipboard() {
  const text = window.optimizedPrompt;
  navigator.clipboard.writeText(text).then(() => {
    alert('Optimized prompt copied to clipboard!');
  }).catch(() => {
    alert('Could not copy to clipboard');
  });
}

function resetForm() {
  document.getElementById('promptInput').value = '';
  document.getElementById('charCount').textContent = '0';
  document.getElementById('resultsContainer').style.display = 'none';
  document.getElementById('removeRedundant').checked = true;
  document.getElementById('minifyWhitespace').checked = true;
  document.getElementById('abbreviate').checked = true;
}
</script>
